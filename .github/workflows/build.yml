name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Tạo thư mục www và copy file web
      - run: npm init -y
      - run: mkdir -p www
      - run: cp index.html style.css www/ 2>/dev/null || true

      # 2. Cài đặt Capacitor, AdMob Plugin & Capacitor Assets (Xử lý Icon)
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob @capacitor/assets esbuild

      # 3. Đóng gói JS
      - run: npx esbuild main.js --bundle --outfile=www/main.js 2>/dev/null || cp main.js www/ 2>/dev/null || true

      # 4. Khởi tạo Capacitor & Android
      - run: npx cap init "AppDienTro" "com.trithucso.tinhtiendientro_0001_x9z" --web-dir www
      - run: npx cap add android

      # 5. TỰ ĐỘNG TẠO ICON APP TỪ FILE icon.png
      - run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi

      # 6. CẤU HÌNH BỎ QUA LỖI SSL MẠNG & CHÈN MÃ ADMOB AN TOÀN
      - run: |
          mkdir -p android/app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>' > android/app/src/main/res/xml/network_security_config.xml

          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          admob_meta = '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>'
          if 'APPLICATION_ID' not in content:
              content = content.replace('</application>', f'    {admob_meta}\n    </application>')
          content = content.replace('<application ', '<application android:networkSecurityConfig=\"@xml/network_security_config\" android:usesCleartextTraffic=\"true\" ')
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(content)
          "

      # 7. Xử lý xung đột Kotlin
      - run: |
          echo "
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          " >> android/app/build.gradle

      # 8. Sync & Build APK
      - run: npx cap sync
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      # 9. Upload Artifact
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk


