  <script>
    const APP_CONFIG = {
      appToken: "com.trithucso.tinhtiendientro_0001_x9z",
      telemetryUrl: "https://khotrithucso.io.vn/apps/api/telemetry.php",
      adTriggerLimit: 5,
      bannerAdId: "ca-app-pub-3940256099942544/6300978111",
      interstitialAdId: "ca-app-pub-3940256099942544/1033173712"
    };

    let deviceId = localStorage.getItem('_app_dev_id') || ('dev_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36));
    localStorage.setItem('_app_dev_id', deviceId);

    // 1. AN TOÀN TELEMETRY LOGGING
    function pushLog(eventType, screenName, keyword = '') {
      const payload = {
        app_token: APP_CONFIG.appToken,
        device_id: deviceId,
        event_type: eventType,
        screen_name: screenName,
        keyword: keyword,
        time: Math.floor(Date.now() / 1000)
      };

      const offlineQueue = JSON.parse(localStorage.getItem('_offline_logs') || '[]');
      offlineQueue.push(payload);

      if (navigator.onLine) {
        fetch(APP_CONFIG.telemetryUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(offlineQueue)
        }).then(res => res.json()).then(() => {
          localStorage.removeItem('_offline_logs');
        }).catch(err => {
          console.log('Telemetry Network Err:', err);
          localStorage.setItem('_offline_logs', JSON.stringify(offlineQueue));
        });
      } else {
        localStorage.setItem('_offline_logs', JSON.stringify(offlineQueue));
      }
    }

    window.addEventListener('online', () => pushLog('network_reconnected', 'system'));

    // 2. ADMOB SMART TRIGGER
    async function initAdMob() {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
        try {
          const { AdMob } = window.Capacitor.Plugins;
          // Khởi tạo SDK bắt buộc
          await AdMob.initialize({});
          showAdMobBanner();
        } catch (err) {
          console.log('AdMob Init Err:', err);
        }
      }
    }

    function showAdMobBanner() {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
        const { AdMob } = window.Capacitor.Plugins;
        AdMob.showBanner({
          adId: APP_CONFIG.bannerAdId,
          adSize: 'BANNER',
          position: 'BOTTOM_CENTER',
          margin: 0
        }).catch(err => console.log('Banner Err:', err));
      }
    }

    function showAdMobInterstitial() {
      pushLog('ad_impression', 'interstitial_full_screen');
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
        const { AdMob } = window.Capacitor.Plugins;
        AdMob.prepareInterstitial({ adId: APP_CONFIG.interstitialAdId })
          .then(() => AdMob.showInterstitial())
          .catch(err => console.log('AdMob Interstitial Err:', err));
      }
    }

    function trackUserInteraction(screenName) {
      pushLog('page_view', screenName);
      let count = parseInt(localStorage.getItem('_act_cnt') || '0') + 1;
      if (count >= APP_CONFIG.adTriggerLimit) {
        showAdMobInterstitial();
        localStorage.setItem('_act_cnt', '0');
      } else {
        localStorage.setItem('_act_cnt', count.toString());
      }
    }

    // 3. LOGIC APP
    function switchTab(tabId, screenName) {
      document.querySelectorAll('.v1_tab_content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.v1_tab_btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (event && event.currentTarget) event.currentTarget.classList.add('active');

      trackUserInteraction(screenName);
    }

    function _exec_calc_bill() {
      const oldNum = parseFloat(document.getElementById('inp_elc_old').value) || 0;
      const newNum = parseFloat(document.getElementById('inp_elc_new').value) || 0;
      const elcPrice = parseFloat(document.getElementById('inp_elc_price').value) || 0;
      const waterPrice = parseFloat(document.getElementById('inp_water_price').value) || 0;
      const peopleCnt = parseFloat(document.getElementById('inp_people_cnt').value) || 1;
      const otherFee = parseFloat(document.getElementById('inp_other_fee').value) || 0;

      const kwh = Math.max(0, newNum - oldNum);
      const totalElc = kwh * elcPrice;
      const totalWater = waterPrice * peopleCnt;
      const grandTotal = totalElc + totalWater + otherFee;

      document.getElementById('res_elc_kwh').innerText = kwh + ' kWh';
      document.getElementById('res_elc_money').innerText = totalElc.toLocaleString('vi-VN') + ' đ';
      document.getElementById('res_water_money').innerText = totalWater.toLocaleString('vi-VN') + ' đ';
      document.getElementById('res_total_money').innerText = grandTotal.toLocaleString('vi-VN') + ' đ';
      document.getElementById('resultBox').style.display = 'block';

      const history = JSON.parse(localStorage.getItem('_bill_history') || '[]');
      history.unshift({ date: new Date().toLocaleDateString('vi-VN'), total: grandTotal, kwh: kwh });
      localStorage.setItem('_bill_history', JSON.stringify(history));
      _render_history();
    }

    function _split_member_bill() {
      const grandTotalText = document.getElementById('res_total_money').innerText;
      const total = parseFloat(grandTotalText.replace(/[^0-9]/g, '')) || 0;
      const names = document.getElementById('inp_member_names').value.split(',').map(s => s.trim()).filter(Boolean);
      
      if (names.length === 0 || total === 0) {
        alert('Vui lòng tính tổng hóa đơn ở Tab 1 trước!');
        return;
      }

      const each = Math.round(total / names.length);
      let html = `<div style="font-weight:700; margin-bottom:6px;">Mỗi người đóng: ${each.toLocaleString('vi-VN')} đ</div>`;
      names.forEach(n => {
        html += `<div class="result-row"><span>${n}:</span><span>${each.toLocaleString('vi-VN')} đ</span></div>`;
      });
      document.getElementById('splitResult').innerHTML = html;
      document.getElementById('splitResult').style.display = 'block';
    }

    function _log_search_kw(kw) {
      if (kw.trim().length > 2) pushLog('search_keyword', 'members', kw);
    }

    function _render_history() {
      const history = JSON.parse(localStorage.getItem('_bill_history') || '[]');
      if (history.length === 0) return;
      let html = '';
      history.slice(0, 5).forEach((h, i) => {
        html += `<div style="padding:6px 0; border-bottom:1px solid #334155;">#${i+1} [${h.date}] - ${h.kwh} kWh - <strong>${h.total.toLocaleString('vi-VN')} đ</strong></div>`;
      });
      document.getElementById('historyList').innerHTML = html;
    }

    function _filter_history(kw) {
      _log_search_kw(kw);
    }

    // 4. CANVAS SCRATCHPAD
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function initCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#0f172a';
    }

    canvas.addEventListener('touchstart', (e) => { drawing = true; ctx.beginPath(); const rect = canvas.getBoundingClientRect(); ctx.moveTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top); });
    canvas.addEventListener('touchmove', (e) => { if(!drawing) return; const rect = canvas.getBoundingClientRect(); ctx.lineTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top); ctx.stroke(); });
    canvas.addEventListener('touchend', () => drawing = false);

    function _clear_canvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    // KHỞI CHẠY KHÔNG VĂNG APP
    document.addEventListener('DOMContentLoaded', () => {
      initCanvas();
      _render_history();
      pushLog('app_start', 'home');
      setTimeout(initAdMob, 1000); // Trì hoãn 1s để Capacitor load xong
    });
  </script>
